name: Bug report
description: A crash, a broken render, a setting that does nothing — anything other than a route coming out wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        English or 日本語, whichever you prefer.

        If the mod works but picks a bad route (a detour, no route at all, a line through a
        mountain), use **Route problem** instead — it asks for the coordinates and diagnostics
        needed to reproduce a search.

  - type: textarea
    id: debug
    attributes:
      label: /xaeronav debug output
      description: |
        Run `/xaeronav debug` in game and paste the output (it is copied to your clipboard). It contains the
        XaeroNav, Minecraft, loader and Xaero versions we need. It also contains your coordinates and the
        world seed — remove them if you would rather not share them.

        If the game crashes before you can run it, write the versions instead:
        `XaeroNav 0.3.4 / Minecraft 1.21.1 / NeoForge 21.1.228 / World Map 1.46.0 / Minimap not installed`
        (on Fabric, add the Fabric API version).
      render: text
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Xaero's World Map
        2. Right-click empty space → "Route here"
        3. ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach `logs/latest.log` (drag the file into this box). For a crash, attach the crash report from `crash-reports/` as well. Paste rather than attach only if it is short.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Non-default settings
      description: Paste `config/xaeronav-client.toml` if you changed anything in it.
      render: toml
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods
      description: Does it still happen with only XaeroNav and Xaero's mods installed? If you did not check, say so — it is still worth reporting.
    validations:
      required: false
