name: Route problem
description: The route detours, stops short, never appears, or goes somewhere you cannot follow
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        English or 日本語, whichever you prefer.

        A route depends on the terrain it was solved over, so a description alone is rarely
        enough to reproduce one. The `/xaeronav debug` and `/xaeronav debug probe` output below —
        versions, dimension, where you stood, the destination, and what the search did — is what
        makes a report actionable.

  - type: dropdown
    id: symptom
    attributes:
      label: What the route did
      options:
        - No route appeared at all
        - The route stops partway and never continues
        - The route takes an obvious detour
        - The route goes somewhere I cannot actually follow
        - The route keeps redrawing itself
        - Something else
    validations:
      required: true

  - type: dropdown
    id: travel
    attributes:
      label: How you were travelling
      options:
        - On foot
        - Gliding with an elytra
        - In a boat
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected the route to do
      description: For a detour, say which way you would have gone instead.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Stand where the problem happens with the destination still set, run these two commands, then paste the output:

        - `/xaeronav debug` — versions, dimension, your position, the destination and the current route (it is also copied to your clipboard)
        - `/xaeronav debug probe` — map data around you, the long-distance route, and what the detailed search reached and why it stopped

        The output includes your coordinates and the world seed. A route cannot be re-run without the coordinates, but you may remove the seed.
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Non-default settings
      description: Paste `config/xaeronav-client.toml` if you changed anything. Digging, bridging and gap jumping being off changes which routes exist at all.
      render: toml
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
      description: A world map screenshot with the route drawn on it explains a detour faster than any description.
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach `logs/latest.log` if the search logged anything unusual.
    validations:
      required: false
