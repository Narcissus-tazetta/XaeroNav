name: Feature request
description: Suggest a new capability or a change to how navigation behaves
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        English or 日本語, whichever you prefer.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation in game, not the solution. What does the mod do today, and why is that not enough?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you already tried
      description: Config options you changed, other mods you used to work around it.
    validations:
      required: false
