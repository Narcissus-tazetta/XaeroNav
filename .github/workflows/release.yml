name: Release

# 手動実行（Actionsタブの "Run workflow"）で、好きなタイミングにリリースできる。
# gradle.properties の mod_version からタグを自動生成・push するので、事前にタグを打つ手順は不要。
# 従来通り `git tag vX.Y.Z && git push --tags` で起動することもできる（タグと mod_version の
# 不一致はここで弾く）。
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read mod_version
        id: mod_version
        run: echo "value=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      # workflow_dispatch: mod_versionからタグ名を導く（vX.Y.Z）
      # タグpush: 打たれたタグがmod_versionと一致するか検証する（ズレたタグでのリリースを防ぐ）
      - name: Resolve release tag
        id: tag
        run: |
          EXPECTED="v${{ steps.mod_version.outputs.value }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$EXPECTED"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "$TAG" != "$EXPECTED" ]; then
              echo "::error::タグ $TAG が gradle.properties の mod_version(${{ steps.mod_version.outputs.value }}) と一致しません。期待されるタグ: $EXPECTED"
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # workflow_dispatchのときだけ、ここでタグを作ってpushする。同名タグが既にあれば
      # mod_versionの上げ忘れなのでエラーにする（同じバージョンでの上書きリリースを防ぐ）
      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::タグ $TAG は既に存在します。gradle.properties の mod_version を上げてから実行してください。"
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build
        run: ./gradlew build -Prelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: build/libs/xaeronav-*.jar
