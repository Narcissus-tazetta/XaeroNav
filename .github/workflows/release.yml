name: Release

# 手動実行（Actionsタブの "Run workflow"）で、好きなタイミング・好きなバージョンでリリースできる。
# バージョンはgradle.propertiesを書き換えず `-Pmod_version` でビルド時に上書きするので、
# リリースのたびにコミットが要らない。従来通り `git tag vX.Y.Z && git push --tags` で
# 起動することもできる（その場合はタグ名がそのままバージョンになる）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン（例: 0.1.1）"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # workflow_dispatch: 入力されたバージョンを使う。タグpush: タグ名から取り出す
      - name: Resolve version and tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::バージョンは X.Y.Z の形式で指定してください（入力値: $VERSION）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # 手動実行のときだけ確認する。タグpushでは、そのタグ自体が既にリモートにある
      # のが正常なのでチェック対象外（同じタグを打ち直すのは別の問題として自然に失敗する）
      - name: Ensure version doesn't collide with an existing release
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::タグ $TAG は既に存在します。別のバージョンを指定してください。"
            exit 1
          fi

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"

      # 全ノード（MCバージョン×ローダー）をビルドして、jarをbuild/libsへ集める
      - name: Build
        run: ./gradlew build collectJars -Prelease -Pmod_version=${{ steps.release.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: build/libs/xaeronav-*.jar
          # jar名とこのパターンが割れると、添付0個のままリリースだけ作られて緑になる（実際そうなった）
          fail_on_unmatched_files: true
