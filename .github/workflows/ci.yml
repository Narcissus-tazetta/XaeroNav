name: CI

on:
  push:
    branches: [main]
  pull_request:

# 読むだけ。ビルドがリポジトリへ書き戻すことは無い
permissions:
  contents: read

# 同じブランチへ続けてpushしたとき、古い実行を打ち切る。
# NeoForgeの初回セットアップだけで5分前後かかるので、積み残すと待ち時間が伸びる一方になる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.nodes.outputs.nodes }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # 全ノード（MCバージョン×ローダー）のコンパイル + フォーマット確認(spotlessCheck) +
      # テストをまとめて実行する。ノードを増やしてもここは変わらない。
      # 実機地形の重いテスト(slowTest)もcheckが依存しているので、手元の既定から外れていても必ず通る。
      # 経路探索のテストが実際に走るのは正典ノードだけ（stonecutter.properties.tomlのcanonical_test_node）。
      - run: ./gradlew build collectJars --console=plain

      # 起動スモークテストのジョブをノードごとに立てるための一覧。
      # ノードの定義はsettings.gradle.ktsにしか無い状態を保つ
      - id: nodes
        run: echo "nodes=$(./gradlew printNodes -q --console=plain | tail -1)" >> "$GITHUB_OUTPUT"

      # 失敗したときに、どのテストがなぜ落ちたかをログを掘らずに見られるようにする
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            versions/*/build/reports/tests/test
            versions/*/build/reports/tests/slowTest
          retention-days: 7

      # PRから実際のjarを落として動作確認できるようにする
      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: xaeronav-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  # 実際にMinecraftを起動して、ワールドへ入るところまで到達できるかを見る。
  #
  # Xaero連携のmixinはrequired=falseなので、注入先が変わっても例外は出ず「地図に線が出ない」だけになる。
  # ビルドが通ることは何の保証にもならないので、起動してログを読むところまでをCIの仕事にする。
  runtime:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(needs.build.outputs.nodes) }}
    name: runtime (${{ matrix.node.node }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and stage mods
        run: ./gradlew :${{ matrix.node.node }}:stageRuntimeTestMods --console=plain

      - name: Put mods into the test client
        run: |
          mkdir -p run/mods
          cp build/runtime-test/${{ matrix.node.node }}/mods/*.jar run/mods/

      # fabric-apiの版はstonecutter.properties.tomlが持つ唯一の情報源から読む
      - id: deps
        if: matrix.node.loader == 'fabric'
        run: |
          VERSION=$(grep 'deps.fabric_api' stonecutter.properties.toml | cut -d'"' -f2 | cut -d'+' -f1)
          echo "fabric_api=$VERSION" >> "$GITHUB_OUTPUT"

      # ワールドへ入ってテストが通ったあと、JVMが終了しないまま止まることがある
      # （両ローダーで発生。最後のログはサーバーの保存完了で、その先のXaeroの
      # セッション終了までは進まない）。打ち切られるとログには何も残らないので、
      # ログが伸びなくなった時点でスタックを取り、クライアントを落として先へ進める
      - name: Watch for a stalled client
        run: |
          nohup bash -c '
            # 起動から終了まで通常60秒前後で、その間ログは途切れなく出続ける。
            # 5分完全に止まっていれば、待っても進まない
            STALL=300
            while [ "$SECONDS" -lt 1500 ]; do
              sleep 15
              LOG=run/logs/latest.log
              [ -f "$LOG" ] || continue
              [ $(( $(date +%s) - $(stat -c %Y "$LOG") )) -ge "$STALL" ] || continue
              PIDS=$(fuser "$LOG" 2>/dev/null || true)
              {
                echo "=== ログが ${STALL}秒 伸びていない。スタックを取る ($(date -u)) ==="
                for PID in ${PIDS:-$(pgrep -f java || true)}; do
                  echo "--- pid=$PID"
                  tr "\0" " " < "/proc/$PID/cmdline" 2>/dev/null; echo
                  "$JAVA_HOME/bin/jstack" -l "$PID" 2>&1 || true
                done
              } > run/logs/threaddump.txt 2>&1
              # fuserで特定できたときだけ落とす。java全部を巻き込むとGradleデーモンまで
              # 巻き添えになり、後続のキャッシュ保存が壊れる
              [ -n "$PIDS" ] && kill -9 $PIDS
              exit 0
            done
          ' > /dev/null 2>&1 &

      # 上のウォッチが効かなかったときの最後の砦。ここで打ち切っても後続の
      # ログ出力・アップロードは `if: always()` で走るので、原因を追う材料は残る
      - name: Run the client
        timeout-minutes: 20
        uses: headlesshq/mc-runtime-test@4.5.1
        with:
          mc: ${{ matrix.node.minecraft }}
          modloader: ${{ matrix.node.loader }}
          regex: .*${{ matrix.node.loader }}.*
          java: 21
          mc-runtime-test: ${{ matrix.node.loader }}
          fabric-api: ${{ matrix.node.loader == 'fabric' && steps.deps.outputs.fabric_api || 'none' }}

      # 起動に失敗・ハングしたときは、まずここを読めば分かるようにする
      # （artifactを落とさなくてもジョブのログで完結させる）
      - name: Show the client log
        if: always()
        run: |
          if [ -f run/logs/threaddump.txt ]; then
            echo "::group::run/logs/threaddump.txt（クライアントが止まっていた）"
            cat run/logs/threaddump.txt
            echo "::endgroup::"
          fi
          if [ -f run/logs/latest.log ]; then
            echo "::group::run/logs/latest.log (末尾200行)"
            tail -200 run/logs/latest.log
            echo "::endgroup::"
          else
            echo "run/logs/latest.log が無い"
            ls -la run/ 2>/dev/null || true
          fi

      # mixinが当たらなかったこと自体はログにしか出ない（configがrequired=falseなので落ちない）。
      # 誰も読まないログは無いのと同じなので、ここで見つけたらCIを落とす
      - name: Check that the Xaero hooks applied
        run: |
          LOG=run/logs/latest.log
          if [ ! -f "$LOG" ]; then
            echo "::error::$LOG が無い。クライアントが起動していない可能性がある"
            exit 1
          fi
          if grep -nE 'Mixin apply failed.*xaeronav|Critical injection failure.*xaeronav|xaeronav-xaero\.mixins\.json.*(failed|error)' "$LOG"; then
            echo "::error::XaeroNavのmixinが当たっていない。Xaeroの版が対応範囲の外にある可能性がある"
            exit 1
          fi
          echo "XaeroNavのmixin適用に失敗の記録は無し"

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-log-${{ matrix.node.node }}
          path: |
            run/logs
            run/crash-reports
          if-no-files-found: warn
          retention-days: 7
