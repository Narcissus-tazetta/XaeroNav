name: CI

on:
  push:
    branches: [main]
  pull_request:

# 読むだけ。ビルドがリポジトリへ書き戻すことは無い
permissions:
  contents: read

# 同じブランチへ続けてpushしたとき、古い実行を打ち切る。
# NeoForgeの初回セットアップだけで5分前後かかるので、積み残すと待ち時間が伸びる一方になる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # コンパイル + フォーマット確認(spotlessCheck) + テストをまとめて実行する。
      # spotlessCheckはjavaプラグインのcheckタスクに自動で組み込まれるため、
      # ./gradlew build だけでこの3つがすべて走る。実機地形の重いテスト(slowTest)も
      # checkが依存しているので、手元の既定から外れていてもCIでは必ず通る。
      - run: ./gradlew build --console=plain

      # 失敗したときに、どのテストがなぜ落ちたかをログを掘らずに見られるようにする
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/reports/tests/slowTest
          retention-days: 7

      # PRから実際のjarを落として動作確認できるようにする
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: xaeronav-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
