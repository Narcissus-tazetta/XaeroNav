name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # コンパイル + フォーマット確認(spotlessCheck) + テストをまとめて実行する。
      # spotlessCheckはjavaプラグインのcheckタスクに自動で組み込まれるため、
      # ./gradlew build だけでこの3つがすべて走る。
      - run: ./gradlew build --console=plain
