name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 通常のPRではruntimeを正典ノードだけに絞るぶん、全ノードのXaeroフック疎通を
    # 週1回は確認する
    - cron: "0 3 * * 1"

# 読むだけ。ビルドがリポジトリへ書き戻すことは無い
permissions:
  contents: read

# 同じブランチへ続けてpushしたとき、古い実行を打ち切る。
# NeoForgeの初回セットアップだけで5分前後かかるので、積み残すと待ち時間が伸びる一方になる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ノード一覧の取得と、runtimeを全ノードへ広げるかどうかの判定だけを行う軽いジョブ。
  # ここを先に独立させることで、下のbuildジョブをノードごとのmatrixに割れる
  # （printNodesはGradleの設定フェーズだけで数秒、フルビルドを待つ必要が無い）。
  discover:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.nodes.outputs.nodes }}
      runtime_nodes: ${{ steps.nodes.outputs.runtime_nodes }}
      canonical_node: ${{ steps.nodes.outputs.canonical_node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # ノード発見だけのジョブから専用キャッシュを書き出しても、後続ビルドには
      # ほぼ再利用できず保存・退避コストだけが増える。
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # runtimeを全ノードへ広げる条件: mainへのpush・週次スケジュール・
      # ノード定義やXaero mixinを触ったPR。それ以外の通常PRは正典ノードだけに絞り、
      # MCバージョンノードが増えてもruntimeジョブの総数が線形に膨らまないようにする
      - name: Decide whether to run the full runtime matrix
        id: full
        run: |
          FULL=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FULL=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            FULL=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
            if echo "$CHANGED" | grep -qE '^(stonecutter\.properties\.toml|settings\.gradle\.kts|src/main/java/net/prason/xaeronav/mixin/|src/main/resources/.*\.mixins\.json)'; then
              FULL=true
            fi
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"

      # ノードの定義はsettings.gradle.ktsにしか無い状態を保つ
      - id: nodes
        run: |
          NODES=$(./gradlew printNodes -q --console=plain | tail -1)
          CANON=$(grep '^canonical_test_node' stonecutter.properties.toml | cut -d'"' -f2)
          echo "nodes=$NODES" >> "$GITHUB_OUTPUT"
          echo "canonical_node=$CANON" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.full.outputs.full }}" = "true" ]; then
            RUNTIME=$NODES
          else
            RUNTIME=$(echo "$NODES" | jq -c --arg c "$CANON" '[.[] | select(.node == $c)]')
          fi
          # 1.20.1-forgeはmc-runtime-test側が1.20.1のForgeインストーラーAPIに対応しておらず、
          # バージョンを変えても直らない構造的な問題（上流 headlesshq/mc-runtime-test#151 に報告済み）。
          # 直るまでジョブごと作らない。ジョブ側のifでは弾けない——job levelのifからは
          # matrixコンテキストを参照できず、ワークフローファイルが丸ごと不正になる
          RUNTIME=$(echo "$RUNTIME" | jq -c '[.[] | select(.node != "1.20.1-forge")]')
          echo "runtime_nodes=$RUNTIME" >> "$GITHUB_OUTPUT"

  # 全ノードの配布jarをコンパイルする。フォーマット確認とテスト（slowTestを含む）は、
  # ソースを共有する正典ノードでだけ行う（stonecutter.properties.tomlのcanonical_test_node）。
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(needs.discover.outputs.nodes) }}
    name: build (${{ matrix.node.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # 経路探索テストは全ノードで同じなので正典ノードだけでコンパイル・実行する。
      # 他ノードでbuildを呼ぶと、Test自体はonlyIfで止まってもcompileTestJavaまでは
      # 同じソースを再コンパイルするため、配布jarの検証に必要なassembleだけを使う。
      - name: Build and verify
        env:
          NODE: ${{ matrix.node.node }}
          CANONICAL_NODE: ${{ needs.discover.outputs.canonical_node }}
        run: |
          if [ "$NODE" = "$CANONICAL_NODE" ]; then
            ./gradlew spotlessCheck ":$NODE:build" --console=plain
          else
            ./gradlew ":$NODE:assemble" --console=plain
          fi

      # 失敗したときに、どのテストがなぜ落ちたかをログを掘らずに見られるようにする
      - name: Upload test report
        if: failure() && matrix.node.node == needs.discover.outputs.canonical_node
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ matrix.node.node }}
          path: |
            versions/${{ matrix.node.node }}/build/reports/tests/test
            versions/${{ matrix.node.node }}/build/reports/tests/slowTest
          retention-days: 7

      # PRから実際のjarを落として動作確認できるようにする
      - name: Upload mod jar
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xaeronav-jar-${{ matrix.node.node }}
          path: versions/${{ matrix.node.node }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  # 実際にMinecraftを起動して、ワールドへ入るところまで到達できるかを見る。
  #
  # Xaero連携のmixinはrequired=falseなので、注入先が変わっても例外は出ず「地図に線が出ない」だけになる。
  # ビルドが通ることは何の保証にもならないので、起動してログを読むところまでをCIの仕事にする。
  runtime:
    # runtime自身が配布jarをビルドするので、build matrixの完了を待つ必要はない。
    # 重いslowTestを含む正典ノードとMinecraft起動確認を並行させ、CI全体の
    # クリティカルパスを「build + runtime」から「長い方だけ」にする。
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(needs.discover.outputs.runtime_nodes) }}
    name: runtime (${{ matrix.node.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # build matrixが同じGradle依存をキャッシュする。runtime matrixからも5組の
      # 類似キャッシュを書き出すと容量を圧迫するため、ここでは復元だけを行う。
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Build and stage mods
        run: ./gradlew :${{ matrix.node.node }}:stageRuntimeTestMods --console=plain

      - name: Put mods into the test client
        run: |
          mkdir -p run/mods
          cp build/runtime-test/${{ matrix.node.node }}/mods/*.jar run/mods/

      # fabric-apiの版はstonecutter.properties.tomlが持つ唯一の情報源から読む。
      # MCバージョンが複数あるとdeps.fabric_apiの行も複数マッチするので、
      # バージョン文字列（値の"+<mc>"サフィックス）で対象ノードの行だけに絞る
      - id: deps
        if: matrix.node.loader == 'fabric'
        run: |
          VERSION=$(grep 'deps.fabric_api' stonecutter.properties.toml \
            | grep -- "+${{ matrix.node.minecraft }}\"" \
            | cut -d'"' -f2 | cut -d'+' -f1)
          echo "fabric_api=$VERSION" >> "$GITHUB_OUTPUT"

      # ワールドへ入ってテストが通ったあと、JVMが終了しないまま止まることがある
      # （両ローダーで発生。最後のログはサーバーの保存完了で、その先のXaeroの
      # セッション終了までは進まない）。打ち切られるとログには何も残らないので、
      # ログが伸びなくなった時点でスタックを取り、クライアントを落として先へ進める
      - name: Watch for a stalled client
        run: |
          nohup bash -c '
            # 起動から終了まで通常60秒前後で、その間ログは途切れなく出続ける。
            # 5分完全に止まっていれば、待っても進まない
            STALL=300
            while [ "$SECONDS" -lt 1500 ]; do
              sleep 15
              LOG=run/logs/latest.log
              [ -f "$LOG" ] || continue
              IDLE=$(( $(date +%s) - $(stat -c %Y "$LOG") ))
              THRESHOLD=$STALL
              # ゲーム内テストが成功したあとの終了処理だけが固まる既知ケースは、
              # 5分待たずに30秒の猶予で診断・終了する。
              if grep -Fq "No tests found, Successfully finished." "$LOG" \
                  && grep -Fq "All dimensions are saved" "$LOG"; then
                THRESHOLD=30
              fi
              [ "$IDLE" -ge "$THRESHOLD" ] || continue
              PIDS=$(fuser "$LOG" 2>/dev/null || true)
              {
                echo "=== ログが ${THRESHOLD}秒 伸びていない。スタックを取る ($(date -u)) ==="
                for PID in ${PIDS:-$(pgrep -f java || true)}; do
                  echo "--- pid=$PID"
                  tr "\0" " " < "/proc/$PID/cmdline" 2>/dev/null; echo
                  "$JAVA_HOME/bin/jstack" -l "$PID" 2>&1 || true
                done
              } > run/logs/threaddump.txt 2>&1
              # fuserで特定できたときだけ落とす。java全部を巻き込むとGradleデーモンまで
              # 巻き添えになり、後続のキャッシュ保存が壊れる
              [ -n "$PIDS" ] && kill -9 $PIDS
              exit 0
            done
          ' > /dev/null 2>&1 &

      # 上のウォッチが効かなかったときの最後の砦。ここで打ち切っても後続の
      # ログ出力・アップロードは `if: always()` で走るので、原因を追う材料は残る
      - name: Run the client
        id: client
        timeout-minutes: 20
        continue-on-error: true
        uses: headlesshq/mc-runtime-test@fbafe02f89f4f13682e7b16dbcee6b6a43f4faca # 4.5.1
        with:
          mc: ${{ matrix.node.minecraft }}
          modloader: ${{ matrix.node.loader }}
          regex: .*${{ matrix.node.loader }}.*
          java: 21
          # mc-runtime-test配布物はForgeだけ"lexforge"という別名でリリースされている
          # （modloader引数の"forge"とは別物。headlesshq/mc-runtime-testのaction.yml参照）
          mc-runtime-test: ${{ matrix.node.loader == 'forge' && 'lexforge' || matrix.node.loader }}
          fabric-api: ${{ matrix.node.loader == 'fabric' && steps.deps.outputs.fabric_api || 'none' }}

      # 起動に失敗・ハングしたときは、まずここを読めば分かるようにする
      # （artifactを落とさなくてもジョブのログで完結させる）
      - name: Show the client log
        if: always()
        run: |
          if [ -f run/logs/threaddump.txt ]; then
            echo "::group::run/logs/threaddump.txt（クライアントが止まっていた）"
            cat run/logs/threaddump.txt
            echo "::endgroup::"
          fi
          if [ -f run/logs/latest.log ]; then
            echo "::group::run/logs/latest.log (末尾200行)"
            tail -200 run/logs/latest.log
            echo "::endgroup::"
          else
            echo "run/logs/latest.log が無い"
            ls -la run/ 2>/dev/null || true
          fi

      # mc-runtime-testはゲーム内テストが完了していても、Minecraftの終了ハングを
      # watchdogがkillするとexit 137を失敗として返す。本当の失敗は隠さず、テスト成功と
      # ワールド保存完了の両方が記録された終了ハングだけを救済する。
      - name: Validate the runtime result
        if: always()
        env:
          CLIENT_OUTCOME: ${{ steps.client.outcome }}
        run: |
          if [ "$CLIENT_OUTCOME" = success ]; then
            exit 0
          fi

          LOG=run/logs/latest.log
          if [ -f "$LOG" ] \
              && grep -Fq "No tests found, Successfully finished." "$LOG" \
              && grep -Fq "All dimensions are saved" "$LOG"; then
            echo "::warning::ゲーム内テストと保存は完了。終了処理のハングだけを成功扱いにする"
            exit 0
          fi

          echo "::error::Minecraftの起動テストが完了していない (outcome=$CLIENT_OUTCOME)"
          exit 1

      # mixinが当たらなかったこと自体はログにしか出ない（configがrequired=falseなので落ちない）。
      # 誰も読まないログは無いのと同じなので、ここで見つけたらCIを落とす
      - name: Check that the Xaero hooks applied
        if: always()
        run: |
          LOG=run/logs/latest.log
          if [ ! -f "$LOG" ]; then
            echo "::error::$LOG が無い。クライアントが起動していない可能性がある"
            exit 1
          fi
          if grep -nE 'Mixin apply failed.*xaeronav|Critical injection failure.*xaeronav|xaeronav-xaero\.mixins\.json.*(failed|error)' "$LOG"; then
            echo "::error::XaeroNavのmixinが当たっていない。Xaeroの版が対応範囲の外にある可能性がある"
            exit 1
          fi
          for HOOK in WORLD_MAP WAYPOINT_MENU MINIMAP; do
            if ! grep -Fq "XAERONAV_HOOK_APPLIED $HOOK" "$LOG"; then
              echo "::error::XaeroNavのmixin適用成功マーカーが無い: $HOOK"
              exit 1
            fi
          done
          echo "XaeroNavの全mixin適用成功を確認"

      - name: Upload client logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-log-${{ matrix.node.node }}
          path: |
            run/logs
            run/crash-reports
          if-no-files-found: warn
          retention-days: 7
