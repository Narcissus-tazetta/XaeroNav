org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# GitHub Actionsのsetup-gradleがローカルbuild cacheも実行間で保存する。
# 特にMinecraft依存の変換済み成果物を繰り返し生成せずに済む。
org.gradle.caching=true
# ForgeGradle 7の開発実行ではclassesとresourcesを同じMOD出力へまとめる必要がある。
# 分離したままだとmods.toml側から@Modクラスが見つからず、constructed 0 modsで停止する。
net.minecraftforge.gradle.merge-source-sets=true
# Maven Central等はCIの並列ジョブから一斉に取りに行くと429やタイムアウトを返す。
# 既定（3回・短い間隔・30秒）では一時的な不調を越えられずジョブごと落ちる
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
