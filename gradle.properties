org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# GitHub Actionsのsetup-gradleがローカルbuild cacheも実行間で保存する。
# 特にMinecraft依存の変換済み成果物を繰り返し生成せずに済む。
org.gradle.caching=true
# ForgeGradle 7の開発実行ではclassesとresourcesを同じMOD出力へまとめる必要がある。
# 分離したままだとmods.toml側から@Modクラスが見つからず、constructed 0 modsで停止する。
net.minecraftforge.gradle.merge-source-sets=true
## Mod
mod_id=xaeronav
mod_name=XaeroNav
mod_version=0.2.0
mod_group_id=net.prason.xaeronav
mod_authors=Prason
mod_description=Google Maps-style shortest path overlay for Xaero's Map and Minimap.
mod_license=MIT
mod_display_url=https://github.com/Narcissus-tazetta/XaeroNav
mod_issue_tracker_url=https://github.com/Narcissus-tazetta/XaeroNav/issues
