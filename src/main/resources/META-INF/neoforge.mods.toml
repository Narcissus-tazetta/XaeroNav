modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}-xaero.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

# Xaeroの世界地図・ミニマップへの経路描画・右クリックメニュー追加はオプション連携（design doc §2-5）。
# 未導入でもこのMOD自体はクラッシュせず、ワールド内描画（PathRenderer）だけで動作する。
[[dependencies.${mod_id}]]
modId="xaeroworldmap"
type="optional"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="xaerominimap"
type="optional"
ordering="AFTER"
side="CLIENT"
