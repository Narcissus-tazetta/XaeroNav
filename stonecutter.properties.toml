# ノードごとの依存バージョン。ノードを増やすときはここへテーブルを1つ足す。
# テーブル名は `[<ローダー>."<MCバージョン>"]` で、build.<ローダー>.gradle.kts の
# `properties.tags(...)` が選ぶ。
#
# deps.xaero_worldmap / deps.xaero_minimap はコンパイルと開発クライアントに使う版。
# deps.xaero_worldmap_min / deps.xaero_minimap_min はMOD定義へ書く「動く下限」で、上の版を上げても動かさない
# （古いXaeroを入れた人をNeoForge/Forgeが起動させなくなる）。下限を下げるときは、その版でビルドして
# Xaeroへの参照（javapで見たメソッド・フィールドの型、refmap）が今の版でのビルドと変わらないことを確かめる。

# 経路探索のテストを実際に走らせるノード。pathfinding/ はローダーにもMCバージョンにも
# 依存しない（//? を書かない鉄則）ので、1ノードで回せば全ノードぶんの検証になる。
# 全ノードで回すとCIの時間が丸ごと倍になるだけで、見つかるものは増えない。
