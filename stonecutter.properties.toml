# ノードごとの依存バージョン。ノードを増やすときはここへテーブルを1つ足す。
# テーブル名は `[<ローダー>."<MCバージョン>"]` で、build.<ローダー>.gradle.kts の
# `properties.tags(...)` が選ぶ。

# 経路探索のテストを実際に走らせるノード。pathfinding/ はローダーにもMCバージョンにも
# 依存しない（//? を書かない鉄則）ので、1ノードで回せば全ノードぶんの検証になる。
# 全ノードで回すとCIの時間が丸ごと倍になるだけで、見つかるものは増えない。
canonical_test_node = "1.21.1-neoforge"

[neoforge."1.21.1"]
deps.minecraft = "1.21.1"
deps.neoforge = "21.1.228"
deps.neoforge_loader_range = "[4,)"
deps.xaerolib = "1.7.1"
deps.xaero_worldmap = "1.44.2"
deps.xaero_minimap = "26.4.2"

[forge."1.21.1"]
deps.minecraft = "1.21.1"
# 開発・実行時に使うForge（正確な版）
deps.forge = "52.1.16"
# mods.tomlへ書く「動く下限」。開発で使う版とは別物にしておく——Fabricで踏んだ落とし穴と同じ理由
# （stonecutter.properties.tomlのdeps.fabric_loader_rangeのコメント参照）
deps.forge_loader_range = "[52,)"
# Forgeは本体にMixinExtrasを同梱していない（NeoForge/Fabricとの違い）。jar-in-jarで足す版
deps.mixinextras = "0.5.5"
deps.xaerolib = "1.7.1"
deps.xaero_worldmap = "1.44.2"
deps.xaero_minimap = "26.4.2"

[fabric."1.20.1"]
deps.minecraft = "1.20.1"
deps.fabric_loader = "0.19.5"
deps.fabric_loader_range = ">=0.15.11"
deps.fabric_api = "0.92.12+1.20.1"
deps.modmenu = "7.2.2"
deps.mixinextras = "0.5.3"
deps.night_config = "3.8.3"
deps.xaerolib = "1.7.3"
deps.xaero_worldmap = "1.46.0"
deps.xaero_minimap = "26.5.0"

[forge."1.20.1"]
deps.minecraft = "1.20.1"
deps.forge = "47.4.23"
deps.forge_loader_range = "[47,)"
deps.mixinextras = "0.5.5"
deps.xaerolib = "1.7.3"
deps.xaero_worldmap = "1.46.0"
deps.xaero_minimap = "26.5.0"

[fabric."1.21.1"]
deps.minecraft = "1.21.1"
# 開発・実行時に使うローダー（loom 1.17のClassTweakerが0.19.0以降を要る）
deps.fabric_loader = "0.19.5"
# fabric.mod.jsonへ書く「動く下限」。開発で使う版とは別物にしておく——ここを開発版に
# 引きずられて上げると、XaeroNavが実際には要らない新しさをユーザーへ強制することになる。
# 下限はハード依存のfabric-apiが要求する値に合わせてある
deps.fabric_loader_range = ">=0.15.11"
deps.fabric_api = "0.116.7+1.21.1"
deps.modmenu = "11.0.4"
# NeoForgeは本体に同梱しているものと同じ版に揃える（mixinの@Local / @WrapOperation）
deps.mixinextras = "0.5.3"
# NeoForge 21.1.228 が同梱している版に揃える
deps.night_config = "3.8.3"
deps.xaerolib = "1.7.1"
deps.xaero_worldmap = "1.44.2"
deps.xaero_minimap = "26.4.2"
